# Publishes the visitor demo to GitHub Pages on every push to main.
# The private prep lab (lab.html) is left out on purpose: it must not be hosted publicly until it has
# server-side sign-in (see HANDOFF.md). The footer link to it is removed from the published copy.
name: Publish demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the public copy (no prep lab)
        run: |
          cp -r Mycoquest.shop _site
          rm -f _site/lab.html
          sed -i '/href="lab.html"/d' _site/Index.html
          if grep -q 'href="lab.html"' _site/Index.html; then echo "Lab link still present"; exit 1; fi
          cp _site/Index.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
